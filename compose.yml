version: "3"
services:
  env:
    # Prebuilt image on GitHub Container Registry.
    image: ghcr.io/missourimrr/multirotor-env:latest
    build:
      context: .
      dockerfile: Env.Containerfile
    container_name: multirotor_env
    network_mode: host
    volumes:
      # The flight-code repo this container runs against. Defaults to the parent directory,
      # which is correct when this repo is checked out as <flight-code>/simulation.
      - type: bind
        source: ${FLIGHT_CODE_ROOT:-..}
        target: /workspace
    working_dir: /workspace
    command: bash
    stdin_open: true
    tty: true
  sim:
    environment:  # See Sim.Containerfile for explanations
      - OUT_PORT=14550
      - OUT_HOST=127.0.0.1
      - NUM_DRONES=1
    image: ghcr.io/missourimrr/multirotor-sim:latest
    build:
      context: .
      dockerfile: Sim.Containerfile
    container_name: multirotor_sim
    network_mode: host
    command: python /ardupilot/Tools/autotest/sim_vehicle.py -v ArduCopter -f airsim-copter --out=127.0.0.1:14550 -A "--sim-port-in=9002 --sim-port-out=9003"
    stdin_open: true
    tty: true
